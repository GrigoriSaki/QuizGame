<!DOCTYPE html>
<html lang="en">
<head>
    <title>NeuronQuiz dashboard </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleDash.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .row{
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>NeuronQuiz</h1>
    
    <div class="container">
        
        <div
        class="sidebar">
        <div class="logo"></div>
        <ul
        class="main">
        <li class="active"><a href="#" >
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
        </a></li>
        <li><a href="userProfile.html">
            <i class="fas fa-user"></i>
            <span>User Profile</span>
        </a></li>
         <li><a href="#">
            <i class="fas fa-trophy"></i>
            <span>Statistics</span>
        </a></li>
        <li><a href="#">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a></li>
        <li class="logout"><a href="#" id="logoutButton">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a></li>
        </ul>
       </div>   
       <div class="main--content">
                <div class="header--wrapper">
                   <div class="header--title">
                    <h2 > Hello USERNAME </h2>
                     <span>Let's try Yourself!</span>
                     
                   </div>
                   <div class="avatar">
                    <h3 id="userEmail">DEFAULT</h3>
                   <img src="avatar.png" >
                   </div>
                </div>

                
                    <div class="row">
                        <div class="quiz--result">
                      <h3>Finished quizzes</h3>
                        <div class="result--row">
                            <div class="brain--icon"></div>
                            <div class="quizCounter">
                            
                             <h2 id="quizCount" >0</h2>
                             
                             <h3>Ready for the next level?</h3>

                            </div>   
                        </div>
    
                    </div>

                    <div class="last--result">
                                <h1>Your last result:</h1>
                                
                                  <div class="row">
                                    <i class="fas fa-trophy"></i>
                                    <h2 id="score">0/10</h2>
                                  </div>
                                
                    </div>

                    </div>
                   
                    
            <div class="start--quiz">
                <button id="startQuizButton">
                    <h1>Start Quiz</h1>
                    </button>
            </div>

                </div>
            </div>



        </div>  
        
    </div>
    <script src="dashboard.js"></script>
    

</body>
</html>
