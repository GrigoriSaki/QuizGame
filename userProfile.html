<!DOCTYPE html>
<html lang="en">
    <head>
        <title>User Profile</title>
         <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="userProfile.css">
    </head>

    <body>
        <div class="background">
            <div class="header">
            <h1>User Profile</h1>
        </div>
        
        <div class="profile-container">
            <div class="profile-header">
                <h2>Profile Information</h2>
            </div>
           <div class="details-container">

                <div class="profile-picture">
                    <img src="avatar.png" alt="Profile Picture">
                </div>

              <div class="details-row">
                <div class="profile-details">
                

                <p><strong>Username:</strong> <span id="username"></span></p>
                <p><strong>Email:</strong> <span id="email"></span></p>
                <p><strong>User since:</strong> <span id="user-since"></span></p>
                <h3 id="admin">Admin</h3>
                
              </div>

              <button id="add-question">Add Question</button>
              </div>
            </div>
        </div>

        <div class="question-container">
            <div class="question-header">
                <h3>Add Question</h3>
            </div>
            <form class="add-question-form">
                <div class="form-group">
                    <label for="question">Your question</label>
                    <input type="text" id="question-text" name="question" required placeholder="Write your question here">
                </div>
            </form>

            <form class="add-good-answer-form">
                <div class="form-group">
                    <label for="good-answer">Correct answer</label>
                    <input type="text" id="good-answer" class="answer-text" name="good-answer" required placeholder="Type correct answer">
                </div>
            </form>

            <form class="add-second-answer-form">
                <div class="form-group">
                    <label for="second-answer">Answer 2</label>
                    <input type="text" id="second-answer" class="answer-text" name="second-answer" required placeholder="Type answer">
                </div>
            </form>

            <form class="add-third-answer-form">
                <div class="form-group">
                    <label for="third-answer">Answer 3</label>
                    <input type="text" id="third-answer" class="answer-text" name="third-answer" required placeholder="Type answer">
                </div>
            </form>

             <form class="add-fourth-answer-form">
                <div class="form-group">
                    <label for="fourth-answer">Answer 4</label>
                    <input type="text" id="fourth-answer" class="answer-text" name="fourth-answer" required placeholder="Type answer">
                </div>
            </form>
            <div class="button-container">
                <button id="submit-btn">Submit Answers</button>
                <button id="cancel-btn">Cancel</button>
            </div>
        </div>

        </div>

        <script src="userProfile.js"></script>
        
        
    </body>


</html>
