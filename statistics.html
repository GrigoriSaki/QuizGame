<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Statistics</title>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="statistics.css">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    </head>

    <body>
        <div class = "background">
            <div class="header">
            <h1>Statistics</h1>
        </div>
        <div class="first--row--content">
            <div class="last--ten--results">
             <h2>Last 10 Results</h2>
             <table>
                <thead>
                    <tr>
                       
                        <th>Score /10</th>
                         <th>Day of week</th>
                        
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        
                        <td>8</td>
                        <td>Monday</td>
                    </tr>
                    <tr>
                        
                        <td>7</td>
                        <td>Tuesday</td>    
                        
                    </tr>
                    <tr>
                       
                        <td>9</td>
                        <td>Wednesday</td>
                       
                    </tr>
                    <tr>
                        
                        <td>6</td>
                       <td>Wednesday</td>
                        
                    </tr>
                    <tr>
                        
                        <td>10</td>
                        <td>Thursday</td>
                    </tr>
                    <tr>
                        
                        <td>5</td>
                        <td>Friday</td>
                        
                    </tr>
                    <tr>
                        
                        <td>8</td>
                        <td>Friday</td>
                        
                    </tr>
                    <tr>
                        
                        <td>7</td>
                        <td>Friday</td>
                        
                    </tr>
                    <tr>
                        
                        <td>9</td>
                        <td>Saturday</td>
                    </tr>
                    <tr>
                        
                        <td>6</td>
                        <td>Sunday</td>
                       
                    </tr>
                </tbody>
                </table>
            </div>
            <div class="average--of--ten--results">
                <h3>Average of last ten</h3>
                <div class="average--value">7.5</div>

            </div>
        </div>
    </body>

</html>
